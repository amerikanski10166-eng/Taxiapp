name: BASGO GID map preload

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    paths-ignore:
      - "public/basgo-gid/city-data/**"

concurrency:
  group: basgo-gid-preload
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Preload Kazakhstan city roads and buildings
        run: node scripts/ingest-basgo-gid.mjs

      - name: Commit refreshed map packages
        run: |
          git config user.name "BASGO GID Bot"
          git config user.email "basgo-gid-bot@users.noreply.github.com"
          git add public/basgo-gid/city-data
          if git diff --cached --quiet; then
            echo "No map package changes."
            exit 0
          fi
          git commit -m "Refresh BASGO GID preloaded city map data"
          git push
